modLoader = "javafml"
loaderVersion = "[${forgeshortversion},)"
license = "MIT"
issueTrackerURL = "https://github.com/WoXayZ/FTBIndustrialColorations/issues"

[[mods]]
modId = "ftbicolor"
version = "${version}"
displayName = "FTB Industrial Colorations"
authors = "WoXayZ"
description = '''
Adds the other 14 dye colors to FTB Industrial Contraptions spray paint.
Recolors machine casings without touching their details, and paints Quantum Armor.
Includes spray paint kits, a selector, and advancements.
'''

[[dependencies.ftbicolor]]
modId = "forge"
mandatory = true
versionRange = "[${forgeversion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ftbicolor]]
modId = "minecraft"
mandatory = true
versionRange = "[${mcversion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ftbicolor]]
modId = "ftbic"
mandatory = true
versionRange = "[1802.1.6,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.ftbicolor]]
