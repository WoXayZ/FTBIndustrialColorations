modLoader = "javafml"
loaderVersion = "[${forgeshortversion},)"
license = "All rights reserved"
issueTrackerURL = "https://github.com/cdaguenet/FTBIndustrialColorations/issues"

[[mods]]
modId = "ftbicolor"
version = "${version}"
displayName = "FTB Industrial Colorations"
authors = "cdaguenet"
description = '''
Extends FTB Industrial Contraptions' spray paint cans to all 14 Minecraft dye colors,
for a total of 16 machine variants. Recolors only the white/light gray body of each
machine while preserving accents, indicators, solar cells and structural details.
'''

[[dependencies.ftbicolor]]
modId = "forge"
mandatory = true
versionRange = "[${forgeversion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ftbicolor]]
modId = "minecraft"
mandatory = true
versionRange = "[${mcversion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ftbicolor]]
modId = "ftbic"
mandatory = true
versionRange = "[1802.1.6,)"
ordering = "AFTER"
side = "BOTH"
