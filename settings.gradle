pluginManagement {
	repositories {
		gradlePluginPortal()
		maven { url = 'https://maven.neoforged.net/releases' }
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'FTBIndustrialColorations'

includeBuild('../ftb-ic-26.1') {
	dependencySubstitution {
		substitute module('dev.ftb.mods:ftb-industrial-contraptions') using project(':')
	}
}
