plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.141'
}

version = "${minecraft_version}-${mod_version}"
group = maven_group
base {
	archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
	version = neoforge_version

	runs {
		client {
			client()
			gameDirectory = project.file('run')
		}
		server {
			server()
			gameDirectory = project.file('run')
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	mavenCentral()
	maven {
		name = "FTB"
		url = "https://maven.ftb.dev/releases"
	}
	maven {
		name = "FTB Snapshots"
		url = "https://maven.ftb.dev/snapshots"
	}
	maven {
		url = "https://maven.saps.dev/minecraft"
		content {
			includeGroup "dev.ftb.mods"
		}
	}
	maven {
		url = "https://www.cursemaven.com"
		content { includeGroup "curse.maven" }
	}
	maven {
		name = "Curios"
		url = "https://maven.theillusivec4.top/"
		content { includeGroup "top.theillusivec4.curios" }
	}
	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
		content { includeGroup "mezz.jei" }
	}
	maven {
		name = "Applied Energistics"
		url = "https://maven.appliedenergistics.org/releases"
		content { includeGroup "org.appliedenergistics" }
	}
}

dependencies {
	implementation 'dev.ftb.mods:ftb-industrial-contraptions'
	implementation "dev.ftb.mods:ftb-materials:${ftb_materials_version}"

	compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
	runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

	runtimeOnly "curse.maven:jade-324717:${jade_curse_file_id}"
	runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"

	compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
	runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

	compileOnly("curse.maven:industrial-contraptions-expansion-core-857669:${ice_core_curse_file_id}") { transitive = false }
	runtimeOnly("curse.maven:industrial-contraptions-expansion-core-857669:${ice_core_curse_file_id}") { transitive = false }
	compileOnly("curse.maven:ic-expansion-generators-857250:${iceg_curse_file_id}") { transitive = false }
	runtimeOnly("curse.maven:ic-expansion-generators-857250:${iceg_curse_file_id}") { transitive = false }
	runtimeOnly files("../nstut-lib/neoforge-26.1.2/build/libs/nstutlib-neoforge-26.1.2-0.8.1.jar")
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
			mod_id                  : mod_id,
			version                 : mod_version,
			minecraft_version       : minecraft_version,
			minecraft_version_range : minecraft_version_range,
			neoforge_version        : neoforge_version,
			neoforge_version_range  : neoforge_version_range,
			neoforge_loader_version : neoforge_loader_version,
			ftb_materials_version_range : ftb_materials_version_range,
	]
	inputs.properties replaceProperties
	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

def releaseJarName = "${archives_base_name}-${minecraft_version}-${mod_version}.jar"

tasks.register("copyReleaseJar", Copy) {
	dependsOn jar
	from jar.archiveFile
	into layout.projectDirectory.dir("release")
	rename { releaseJarName }
}
